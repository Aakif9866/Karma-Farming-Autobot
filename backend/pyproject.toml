[project]
name = "kfa-backend"
version = "0.1.0"
description = "Karma Farming Autobot backend (FastAPI + Celery)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "celery>=5.6.3",
    "fastapi>=0.142.2",
    "itsdangerous>=2.2.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy>=2",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # asserts are fine

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107"]  # fake test passwords

[tool.mypy]
strict = true
plugins = []

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs Postgres + Redis",
    "eval: hits real LLM APIs (manual/nightly only)",
]
addopts = "-m 'not eval'"
